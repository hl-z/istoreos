name: 编译 OECT 专用 iStoreOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取 iStoreOS 官方源码
        uses: actions/checkout@v4
        with:
          repository: istoreos/istoreos
          ref: main

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev bison flex python3 git unzip curl

      - name: 配置 OECT RK3328
        run: |
          cat > .config << EOF
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_rk3328=y
          CONFIG_TARGET_rockchip_rk3328_DEVICE_oect=y
          CONFIG_PACKAGE_aliyundrive-webdav=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tmux=y
          EOF
          make defconfig

      - name: 编译固件
        run: make -j$(nproc)

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OECT-iStoreOS-完整固件
          path: bin/targets/rockchip/rk3328/*.img.gz
