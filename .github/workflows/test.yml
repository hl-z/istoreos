name: 编译 OECT 专用 iStoreOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取官方源码
        uses: actions/checkout@v4
        with:
          repository: istoreos/istoreos
          ref: istoreos-24.10
          path: istoreos

      - name: 安装完整编译依赖
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential libncurses-dev libssl-dev bison flex \
            python3 python3-dev python3-setuptools python3-pip \
            git unzip curl wget file rsync zlib1g-dev libelf-dev \
            libncurses5-dev libreadline-dev libsqlite3-dev libbz2-dev \
            liblzma-dev tk-dev libgdbm-dev libdb-dev libpcap-dev
          # 安装关键的 pyelftools 模块
          pip3 install pyelftools

      - name: 配置 OECT 固件
        working-directory: istoreos
        run: |
          cat > .config << EOF
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_rk3328=y
          CONFIG_TARGET_rockchip_rk3328_DEVICE_oect=y
          CONFIG_PACKAGE_aliyundrive-webdav=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tmux=y
          EOF
          make defconfig

      - name: 开始编译（单线程，稳定优先）
        working-directory: istoreos
        run: make -j1 V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OECT-iStoreOS-固件
          path: istoreos/bin/targets/rockchip/rk3328/*.img.gz
